<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef3f7">
  <meta name="robots" content="noindex">
  <script>
    try {
      var t = localStorage.getItem('cm.theme') || 'auto';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) { /* */ }
  </script>
  <title>الحساب مجمّد — CoffeeFlow</title>
  <link rel="icon" href="/coffeeflow.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap">
  <style>
    :root { --bg: #eef3f7; --card: #ffffff; --ink: #1d2b36; --ink-2: #566874; --ice: #dfeaf3; --ice-ink: #2c5a7a; --line: #d6e2ec; }
    [data-theme="dark"] { --bg: #10161b; --card: #182129; --ink: #e8eef3; --ink-2: #9aaebb; --ice: #1c2a35; --ice-ink: #b4d0e4; --line: #263540; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; font-family: Alexandria, system-ui, sans-serif; background: radial-gradient(60% 45% at 50% 22%, var(--ice), transparent 70%), var(--bg); color: var(--ink); }
    .card { width: min(420px, 100%); display: grid; gap: 14px; justify-items: center; text-align: center; padding: 34px 26px; border-radius: 28px; background: var(--card); box-shadow: 0 24px 50px -30px rgba(20, 40, 60, .55), inset 0 0 0 1px var(--line); }
    .ic { width: 76px; height: 76px; display: grid; place-items: center; border-radius: 50%; background: var(--ice); color: var(--ice-ink); }
    .ic svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    h1 { margin: 4px 0 0; font-size: 24px; font-weight: 800; }
    p { margin: 0; color: var(--ink-2); line-height: 1.7; max-width: 32ch; }
    .foot { margin-top: 6px; font-size: 12.5px; color: var(--ink-2); direction: ltr; }
    .foot b { color: var(--ink); }
    button { margin-top: 4px; font: inherit; font-weight: 600; font-size: 14px; padding: 10px 20px; border: 0; border-radius: 999px; background: var(--ice); color: var(--ice-ink); cursor: pointer; }
  </style>
</head>
<body>
  <main class="card">
    <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/><path d="M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5"/></svg></span>
    <h1 id="title">المحل مش متاح هلأ</h1>
    <p id="msg">الطلب من الطاولة متوقف مؤقتاً. اطلب من الكاشير مباشرة، وشكراً لصبرك 🙏</p>
    <button type="button" onclick="location.reload()">جرّب كمان مرة</button>
    <span class="foot">Coffee<b>Flow</b></span>
  </main>
  <script>
    // لوحة الكاشير بتشوف السبب الحقيقي، الزبون بيشوف رسالة لطيفة
    if (/\/admin\/?$/.test(location.pathname)) {
      document.getElementById('title').textContent = 'الحساب مجمّد';
      document.getElementById('msg').textContent = 'حساب المحل مجمّد مؤقتاً من إدارة CoffeeFlow، وكل بياناتك محفوظة. تواصل معنا عشان نرجّعه.';
    }
  </script>
</body>
</html>
