<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4ece1">
  <title>لوحة الكاشير — كافي محمد</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Aref+Ruqaa:wght@400;700&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">
  <div class="grain" aria-hidden="true"></div>

  <!-- تسجيل الدخول -->
  <section class="login" id="login" hidden>
    <div class="login-card">
      <div class="login-logo" id="loginLogo"></div>
      <h1 class="login-title">لوحة الكاشير</h1>
      <p class="login-sub">اكتب رمز الدخول</p>
      <div class="pin-dots" id="pinDots" aria-live="polite"></div>
      <div class="keypad" id="pinPad"></div>
      <p class="login-err" id="loginErr" role="alert"></p>
    </div>
  </section>

  <!-- التطبيق -->
  <div class="app" id="app" hidden>
    <aside class="side">
      <div class="side-brand" id="sideBrand"></div>
      <nav class="side-nav" id="sideNav" aria-label="أقسام اللوحة"></nav>
      <div class="side-foot">
        <button class="side-link side-close" id="closeShopBtn" type="button"></button>
        <button class="side-link" id="soundBtn" type="button"></button>
        <a class="side-link" href="/" target="_blank" rel="noopener" id="openMenu"></a>
        <button class="side-link" id="logoutBtn" type="button"></button>
      </div>
    </aside>

    <main class="main">
      <header class="bar">
        <div>
          <h1 class="bar-title" id="viewTitle">الصالة</h1>
          <p class="bar-sub" id="viewSub"></p>
        </div>
        <div class="bar-right">
          <div class="bar-stats" id="barStats"></div>
          <span class="live" id="live" title="الاتصال المباشر"><i></i><span>مباشر</span></span>
          <span class="clock num" id="clock"></span>
        </div>
      </header>

      <section class="view" data-view="floor">
        <div class="floor-head">
          <div class="legend" id="legend"></div>
          <div class="floor-alerts" id="floorAlerts"></div>
        </div>
        <div id="floor"></div>
      </section>

      <section class="view" data-view="orders" hidden>
        <div class="kanban" id="kanban"></div>
      </section>

      <section class="view" data-view="menu" hidden>
        <div class="toolbar">
          <div class="cat-pills" id="catPills"></div>
          <div class="toolbar-actions">
            <input class="input search" id="itemSearch" type="search" placeholder="دوّر على صنف…" aria-label="بحث بالأصناف">
            <button class="btn btn-ghost btn-sm" id="addCategory" type="button"></button>
            <button class="btn btn-brass btn-sm" id="addItem" type="button"></button>
          </div>
        </div>
        <div class="item-rows" id="itemRows"></div>
      </section>

      <section class="view" data-view="offers" hidden>
        <div class="toolbar"><p class="muted">العروض المجمّعة بتظهر كبطاقات للزبون، والخصومات بتنطبق تلقائياً على أسعار الأصناف.</p>
          <button class="btn btn-brass btn-sm" id="addOffer" type="button"></button></div>
        <div class="offer-cards" id="offerCards"></div>
      </section>

      <section class="view" data-view="tables" hidden>
        <div class="tables-layout">
          <div class="panel">
            <div class="panel-head"><h2>المناطق</h2><button class="btn btn-ghost btn-sm" id="addZone" type="button"></button></div>
            <p class="muted">وصف كل منطقة بيستعمله الباريستا الذكي ليقترح على الزبون حسب مكان قعدته.</p>
            <div id="zoneList" class="zone-list"></div>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>الطاولات</h2>
              <div class="inline-form">
                <label class="field-inline"><span>العدد</span><input class="input num-input" id="tableCount" type="number" min="1" max="300"></label>
                <button class="btn btn-ghost btn-sm" id="applyCount" type="button">تطبيق</button>
              </div>
            </div>
            <div class="cashier-card" id="cashierCard" hidden></div>
            <div class="site-qr">
              <div class="qr" id="siteQr"></div>
              <div class="site-qr-info">
                <strong>QR واحد لكل الطاولات</strong>
                <p class="muted" id="siteQrHint">الزبون بيمسحه وبيفتح الموقع، وأول اشي بيكتب رقم طاولته.</p>
                <label class="field-inline"><span id="qrBaseLabel">رابط الموقع</span><input class="input" id="qrBase" dir="ltr"></label>
                <div class="row">
                  <button class="btn btn-ghost btn-sm" id="copyLink" type="button" hidden></button>
                  <button class="btn btn-brass btn-sm" id="printCards" type="button"></button>
                </div>
              </div>
            </div>
            <div class="table-grid" id="tableGrid"></div>
          </div>
        </div>
      </section>

      <section class="view" data-view="reports" hidden>
        <div id="reports"></div>
      </section>

      <section class="view" data-view="settings" hidden>
        <div id="settings"></div>
      </section>
    </main>

    <!-- تفاصيل الطاولة -->
    <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
      <div class="drawer-inner" id="drawerInner"></div>
    </aside>
  </div>

  <!-- محرر عام -->
  <section class="sheet editor" id="editor" role="dialog" aria-modal="true" aria-labelledby="editorTitle" aria-hidden="true">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2 class="sheet-title" id="editorTitle"></h2>
      <button class="icon-btn" data-close-sheet type="button" aria-label="إغلاق" id="editorClose"></button>
    </div>
    <form class="sheet-body" id="editorForm" novalidate></form>
    <div class="sheet-foot editor-foot" id="editorFoot"></div>
  </section>

  <div id="printArea" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
