<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4ece1">
  <script>
    try {
      var t = localStorage.getItem('cm.theme') || 'auto';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) { /* */ }
  </script>
  <title>CoffeeFlow — منصة الطلب الذكي</title>
  <meta name="description" content="منصة طلب من الطاولة للكافيهات والمطاعم: صفحة زبائن، لوحة كاشير، وباريستا ذكي.">
  <link rel="icon" href="/coffeeflow.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/css/platform.css">
  <link rel="stylesheet" href="/css/theme.css">
  <style>
    .home { min-height: 100dvh; display: grid; place-items: center; padding: 28px 16px; background: radial-gradient(60% 45% at 50% 20%, rgba(212, 163, 89, .18), transparent 70%), var(--harbor); }
    .home-card { width: min(460px, 100%); display: grid; gap: 18px; justify-items: center; text-align: center; }
    .home-mark { width: 84px; height: 84px; }
    .home-mark img { width: 100%; height: 100%; border-radius: 22%; box-shadow: 0 16px 32px -16px rgba(43, 26, 18, .9); }
    .home h1 { margin: 0; font-size: clamp(34px, 8vw, 44px); font-weight: 800; letter-spacing: -.5px; direction: ltr; }
    .home h1 b { color: var(--gold); }
    .home p { margin: -8px 0 0; color: var(--foam-2); max-width: 36ch; }
    .home-go { width: 100%; display: grid; gap: 10px; padding: 18px; border-radius: 22px; background: var(--tide); box-shadow: var(--shadow-card), inset 0 0 0 1px var(--line); }
    .home-go label { font-size: 14px; color: var(--foam-2); text-align: start; }
    .home-go .row { display: flex; gap: 8px; }
    .home-go .input { flex: 1; text-align: center; font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    .home-foot { font-size: 13px; color: var(--foam-3); }
    .home-foot a { color: var(--brass-hi); font-weight: 600; }
  </style>
</head>
<body>
  <main class="home">
    <div class="home-card">
      <span class="home-mark"><img src="/coffeeflow.svg" alt=""></span>
      <h1>Coffee<b>Flow</b></h1>
      <p>منصة الطلب الذكي للكافيهات والمطاعم: الزبون بيطلب من طاولته، والكاشير بيشوف الطلب بنفس اللحظة.</p>
      <form class="home-go" id="go">
        <label for="tid">اكتب رقم المحل (موجود على الـ QR)</label>
        <div class="row">
          <input class="input" id="tid" inputmode="numeric" pattern="\d{3,8}" maxlength="8" placeholder="1001" dir="ltr" autocomplete="off">
          <button class="btn btn-brass" type="submit">ادخل</button>
        </div>
      </form>
      <p class="home-foot">صاحب منصة؟ <a href="/platform">دخول لوحة المنصة</a></p>
    </div>
  </main>
  <script>
    document.getElementById('go').addEventListener('submit', function (e) {
      e.preventDefault();
      var id = document.getElementById('tid').value.replace(/\D/g, '');
      if (id.length >= 3) location.href = '/' + id;
    });
  </script>
</body>
</html>
